name: tests
on: [push, pull_request]
jobs:
  parity:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.14']
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.9.11'
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked python -B -m unittest discover -s tests -v
      - run: |
          COORDINATOR_UNDER_TEST="$PWD/tests/fixtures/bash/cubrid-build-coordinator.sh" \
          INSPECTOR_UNDER_TEST="$PWD/tests/fixtures/bash/cubrid-lock-status.py" \
          uv run --locked python -B -m unittest discover -s tests -p 'test_*legacy.py' -v
      - run: uv build
      - run: uv run --locked cubrid-build-coordinator --help
